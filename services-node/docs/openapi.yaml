openapi: 3.0.3
info:
  title: SIMRS Node Service API
  version: 1.0.0
  description: |
    Layanan Node.js pendamping SIMRS Rawat Jalan. Hanya membaca schema `reporting`
    dan tabel referensi, serta menulis schema `integration`. Autentikasi memakai
    JWT RS256 yang diterbitkan Yii (public key).
servers:
  - url: http://127.0.0.1:3001/svc/v1
    description: DEV
tags:
  - name: Health
  - name: Dashboard
  - name: Laboratorium
  - name: Integrasi
  - name: Bonus
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Health check service dan database
      responses:
        '200': { description: Sehat }
        '503': { description: Database tidak terjangkau }
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Ringkasan kunjungan, pendapatan, dan pasien
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: Ringkasan }
        '401': { description: Token tidak valid }
  /dashboard/visits-by-poli:
    get:
      tags: [Dashboard]
      summary: Jumlah kunjungan per poli
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: Daftar poli }
  /dashboard/procedures:
    get:
      tags: [Dashboard]
      summary: Tindakan teratas berdasarkan nilai
      responses:
        '200': { description: Daftar tindakan }
  /dashboard/revenue:
    get:
      tags: [Dashboard]
      summary: Pendapatan harian
      responses:
        '200': { description: Deret harian }
  /dashboard/medicine-usage:
    get:
      tags: [Dashboard]
      summary: Pemakaian obat dari resep dispensed
      responses:
        '200': { description: Daftar obat }
  /dashboard/payment-status:
    get:
      tags: [Dashboard]
      summary: Distribusi status invoice
      responses:
        '200': { description: Status pembayaran }
  /dashboard/details:
    get:
      tags: [Dashboard]
      summary: Detail tabel dashboard
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [visits, revenue, procedures] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: Baris detail }
  /dashboard/export:
    get:
      tags: [Dashboard]
      summary: Ekspor CSV
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [visits, revenue] } }
      responses:
        '200':
          description: Berkas CSV
          content:
            text/csv:
              schema: { type: string }
  /lab/orders:
    get:
      tags: [Laboratorium]
      summary: Daftar order laboratorium
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [ORDERED, IN_PROGRESS, COMPLETED, CANCELLED] } }
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        '200': { description: Daftar order }
  /lab/orders/{id}:
    get:
      tags: [Laboratorium]
      summary: Detail order laboratorium
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Detail order }
        '404': { description: Tidak ditemukan }
  /lab/orders/{id}/results:
    post:
      tags: [Laboratorium]
      summary: Kirim hasil laboratorium (masuk inbox lalu disinkronkan ke Yii)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lab_order_item_id, result_value]
              properties:
                lab_order_item_id: { type: integer }
                result_value: { type: string }
                unit: { type: string }
                ref_range: { type: string }
                flag: { type: string, enum: [NORMAL, HIGH, LOW, CRITICAL] }
                notes: { type: string }
                external_ref: { type: string }
      responses:
        '201': { description: Hasil tersimpan dan tersinkron }
        '202': { description: Hasil tersimpan, sinkronisasi tertunda }
        '422': { description: Validasi gagal }
  /integration/outbox:
    get:
      tags: [Integrasi]
      summary: Daftar event outbox (admin)
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [PENDING, SENT, FAILED, DEAD] } }
      responses:
        '200': { description: Daftar outbox }
  /integration/outbox/{id}/retry:
    post:
      tags: [Integrasi]
      summary: Jadwalkan ulang event outbox (admin)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Dijadwalkan ulang }
  /integration/outbox/run:
    post:
      tags: [Integrasi]
      summary: Jalankan worker outbox sekali (admin)
      responses:
        '200': { description: Hasil pemrosesan }
  /integration/inbox:
    get:
      tags: [Integrasi]
      summary: Daftar inbox integrasi (admin)
      responses:
        '200': { description: Daftar inbox }
  /integration/inbox/{id}/retry:
    post:
      tags: [Integrasi]
      summary: Sinkronkan ulang inbox ke Yii (admin)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Tersinkron }
        '502': { description: Masih gagal }
  /satusehat/encounters/{visitId}/bundle:
    get:
      tags: [Bonus]
      summary: FHIR Bundle encounter (mock SatuSehat)
      parameters:
        - { in: path, name: visitId, required: true, schema: { type: integer } }
      responses:
        '200': { description: Bundle FHIR }
  /bpjs/sep/mock:
    post:
      tags: [Bonus]
      summary: Buat nomor SEP mock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visit_id]
              properties:
                visit_id: { type: integer }
      responses:
        '201': { description: SEP mock }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
